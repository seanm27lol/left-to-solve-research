name: Verify almost-perfect component bounds
on:
  pull_request:
    paths:
      - 'checks/almost_perfect_*.py'
      - 'notes/almost-perfect-*.md'
      - '.github/workflows/almost-perfect-components.yml'
  push:
    branches: [main]
    paths:
      - 'checks/almost_perfect_*.py'
      - 'notes/almost-perfect-*.md'
      - '.github/workflows/almost-perfect-components.yml'
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - run: python checks/almost_perfect_component_obstructions.py
      - run: python checks/almost_perfect_common_shifts.py
      - run: python checks/almost_perfect_higher_exponents.py
      - run: python checks/almost_perfect_common_quotients.py
      - run: python checks/almost_perfect_largest_gap.py
      - run: python checks/almost_perfect_small_unsplit_residues.py
